[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptes-prompt-engine"
version = "0.1.0"
description = "Persistent, evidence-aware continuation kernel for the Panoptes prompt engine"
requires-python = ">=3.11"

[project.scripts]
panoptes = "panoptes.cli:main"

[tool.setuptools.packages.find]
include = ["panoptes*"]
